[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sketchik"
version = "0.1.0"
description = "Small IK and joint-control execution base for LIBERO symbolic sketches"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2", "scipy>=1.12", "mujoco==3.3.0", "robosuite==1.5.2", "imageio[ffmpeg]", "Pillow", "PyYAML"]

[project.scripts]
sketchik = "sketchik.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
